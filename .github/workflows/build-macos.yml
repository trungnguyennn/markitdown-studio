# Builds the macOS app on GitHub's Mac machines, for when no Mac is at hand.
# Run it from the repository's Actions tab ("Build macOS app" -> Run workflow),
# then download the .dmg from the run's Artifacts section.
name: Build macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon (arm64); Intel Macs are not a target
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: PYTHON=python3 bash setup_mac.sh
      - name: Build, self-test and package
        run: TEST_TIMEOUT=240 bash build_mac.sh
      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDownStudio-mac-arm64
          path: dist/mac/*.dmg
          compression-level: 0   # the .dmg is already compressed
      - name: Upload self-test results (screenshot + converted samples)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-mac-arm64
          path: build/mac-test/out
          if-no-files-found: ignore
