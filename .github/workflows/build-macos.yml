# Builds the macOS app on GitHub's Mac machines, for when no Mac is at hand.
# Run it from the repository's Actions tab ("Build macOS app" -> Run workflow),
# then download the .dmg from the run's Artifacts section.
name: Build macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon (arm64)
          - runner: macos-15-intel    # Intel (x86_64)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: PYTHON=python3 bash setup_mac.sh
      - name: Build, self-test and package
        run: bash build_mac.sh
      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDownStudio-${{ matrix.runner }}
          path: dist/mac/*.dmg
          compression-level: 0   # the .dmg is already compressed
      - name: Upload self-test results (screenshot + converted samples)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-${{ matrix.runner }}
          path: build/mac-test/out
          if-no-files-found: ignore
